<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KEDO Feedback</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
            margin: 0;
            padding: 40px 20px;
        }

        .feedback-box {
            max-width: 650px;
            margin: auto;
            background: #1b1b1b;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 25px;
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #aaa;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .optional {
            font-weight: normal;
            color: #888;
        }

        input,
        select,
        textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #555;
            border-radius: 7px;
            background: #111;
            color: #eee;
            font: inherit;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #777;
        }

        .email-note {
            color: #888;
            font-size: 13px;
            margin-top: 6px;
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            gap: 10px;
        }

        #counter {
            color: #888;
            font-size: 14px;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            background: #eee;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ccc;
        }

        #status {
            margin-top: 15px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <main class="feedback-box">

        <h1>KEDO Feedback</h1>

        <p class="subtitle">
            Found a bug? Have a feature idea? Want to contribute?
            Tell us about it.
        </p>

        <!--
            WEB3FORMS
            Replace YOUR_ACCESS_KEY with your Web3Forms access key.
        -->

        <form
            id="feedbackForm"
            action="https://api.web3forms.com/submit"
            method="POST"
        >

            <input
                type="hidden"
                name="access_key"
                value="YOUR_ACCESS_KEY"
            >

            <input
                type="hidden"
                name="subject"
                value="KEDO Website Feedback"
            >

            <input
                type="hidden"
                name="from_name"
                value="KEDO Feedback"
            >


            <!-- Name -->

            <label for="name">
                Name / username
                <span class="optional">(optional)</span>
            </label>

            <input
                type="text"
                id="name"
                name="name"
                maxlength="60"
                placeholder="e.g. Oxsysgen_13"
            >


            <!-- Feedback type -->

            <label for="type">
                Feedback type
            </label>

            <select id="type" name="type">

                <option value="bug">
                    Bug report
                </option>

                <option value="feature">
                    Feature request
                </option>

                <option value="contribution">
                    Contribution
                </option>

                <option value="suggestion">
                    Suggestion
                </option>

                <option value="other">
                    Other
                </option>

            </select>


            <!-- Email -->

            <label for="email">
                Email
                <span
                    id="emailRequired"
                    class="optional"
                >
                    (optional)
                </span>
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
            >

            <p class="email-note">
                An email is required if you're submitting a contribution
                so we can contact you about it.
            </p>


            <!-- Message -->

            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                name="message"
                maxlength="2000"
                required
                placeholder="Tell us what happened or what you'd like to contribute..."
            ></textarea>


            <!-- Submit -->

            <div class="bottom">

                <span id="counter">
                    0 / 2000
                </span>

                <button type="submit">
                    Send feedback
                </button>

            </div>

            <div
                id="status"
                aria-live="polite"
            ></div>

        </form>

    </main>


    <script>

        const form =
            document.getElementById("feedbackForm");

        const message =
            document.getElementById("message");

        const counter =
            document.getElementById("counter");

        const status =
            document.getElementById("status");

        const type =
            document.getElementById("type");

        const email =
            document.getElementById("email");

        const emailRequired =
            document.getElementById("emailRequired");


        /*
         * Character counter
         */

        message.addEventListener("input", function () {

            counter.textContent =
                message.value.length + " / 2000";

        });


        /*
         * Contributions require an email.
         */

        function updateEmailRequirement() {

            if (type.value === "contribution") {

                email.required = true;

                emailRequired.textContent =
                    "(required for contributions)";

            } else {

                email.required = false;

                emailRequired.textContent =
                    "(optional)";

            }

        }


        type.addEventListener(
            "change",
            updateEmailRequirement
        );


        /*
         * Validate before sending.
         */

        form.addEventListener("submit", function (event) {

            const text =
                message.value.trim();


            if (text.length < 5) {

                event.preventDefault();

                status.textContent =
                    "Please provide a little more detail.";

                message.focus();

                return;

            }


            if (
                type.value === "contribution" &&
                email.value.trim() === ""
            ) {

                event.preventDefault();

                status.textContent =
                    "An email address is required for contributions.";

                email.focus();

                return;

            }

            /*
             * If validation succeeds, we DON'T preventDefault().
             *
             * The browser sends the form to Web3Forms.
             */

        });


        /*
         * Initialize.
         */

        updateEmailRequirement();

    </script>

</body>
</html>
