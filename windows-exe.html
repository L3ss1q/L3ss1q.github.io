<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>window.exe</title>

<style>
    * {
        box-sizing: border-box;
        user-select: none;
    }

    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        font-family: monospace;
        background: #008080;
    }

    #desktop {
        width: 100%;
        height: calc(100vh - 40px);
        position: relative;
    }

    .icon {
        width: 90px;
        text-align: center;
        color: white;
        padding: 10px;
        cursor: pointer;
    }

    .icon:hover {
        background: rgba(255,255,255,0.2);
    }

    .icon-image {
        font-size: 40px;
    }

    .window {
        position: absolute;
        width: 400px;
        min-height: 200px;
        background: #c0c0c0;
        border: 3px outset #eee;
        box-shadow: 8px 8px rgba(0,0,0,0.3);
    }

    .titlebar {
        height: 28px;
        background: #000080;
        color: white;
        padding: 4px 6px;
        font-weight: bold;
        cursor: move;
        display: flex;
        justify-content: space-between;
    }

    .close {
        background: #c0c0c0;
        color: black;
        border: 2px outset white;
        width: 22px;
        height: 20px;
        line-height: 14px;
        cursor: pointer;
        font-weight: bold;
    }

    .content {
        padding: 15px;
        color: black;
    }

    button {
        font-family: monospace;
        border: 2px outset white;
        background: #c0c0c0;
        padding: 5px 12px;
        cursor: pointer;
    }

    button:active {
        border-style: inset;
    }

    textarea {
        width: 100%;
        height: 150px;
        resize: none;
    }

    #taskbar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 40px;
        background: #c0c0c0;
        border-top: 3px outset white;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 3px;
        z-index: 99999;
    }

    #start {
        font-weight: bold;
        height: 32px;
    }

    .task {
        height: 30px;
        min-width: 120px;
        overflow: hidden;
        white-space: nowrap;
    }

    #clock {
        margin-left: auto;
        padding: 5px 12px;
        border: 2px inset white;
    }
</style>
</head>

<body>

<div id="desktop">

    <div class="icon" onclick="openExplorer()">
        <div class="icon-image">📁</div>
        File Explorer
    </div>

    <div class="icon" onclick="openNotepad()">
        <div class="icon-image">📄</div>
        Notepad
    </div>

    <div class="icon" onclick="openCalculator()">
        <div class="icon-image">🧮</div>
        Calculator
    </div>

    <div class="icon" onclick="openAbout()">
        <div class="icon-image">❓</div>
        About
    </div>

</div>

<div id="taskbar">
    <button id="start" onclick="startMenu()">▣ Start</button>
    <div id="tasks"></div>
    <div id="clock">00:00</div>
</div>


<script>

let windowCount = 0;
let zIndex = 10;


/* ---------- WINDOW SYSTEM ---------- */

function createWindow(title, html, width = 400, height = 250) {

    windowCount++;

    const win = document.createElement("div");

    win.className = "window";

    win.style.width = width + "px";
    win.style.minHeight = height + "px";

    win.style.left =
        (80 + Math.random() * 200) + "px";

    win.style.top =
        (40 + Math.random() * 150) + "px";

    win.style.zIndex = ++zIndex;

    win.innerHTML = `
        <div class="titlebar">
            <span>${title}</span>
            <button class="close">X</button>
        </div>

        <div class="content">
            ${html}
        </div>
    `;

    document.getElementById("desktop").appendChild(win);

    const close = win.querySelector(".close");

    close.onclick = () => {
        win.remove();
        updateTasks();
    };

    win.addEventListener("mousedown", () => {
        win.style.zIndex = ++zIndex;
    });

    makeDraggable(win);

    updateTasks();

    return win;
}


/* ---------- DRAGGING ---------- */

function makeDraggable(win) {

    const bar = win.querySelector(".titlebar");

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    bar.addEventListener("mousedown", event => {

        dragging = true;

        offsetX =
            event.clientX - win.offsetLeft;

        offsetY =
            event.clientY - win.offsetTop;
    });

    document.addEventListener("mousemove", event => {

        if (!dragging) return;

        win.style.left =
            (event.clientX - offsetX) + "px";

        win.style.top =
            (event.clientY - offsetY) + "px";
    });

    document.addEventListener("mouseup", () => {
        dragging = false;
    });
}


/* ---------- FILE EXPLORER ---------- */

function openExplorer() {

    createWindow(
        "File Explorer",
        `
        <h3>📁 C:\\</h3>

        <p>📁 Windows</p>
        <p>📁 Program Files</p>
        <p>📁 Users</p>
        <p>📄 AUTOEXEC.BAT</p>
        <p>📄 CONFIG.SYS</p>
        <p>📄 DO_NOT_OPEN.TXT</p>

        <button onclick="secretFile()">
            Open DO_NOT_OPEN.TXT
        </button>
        `,
        450,
        350
    );
}


/* ---------- SECRET FILE ---------- */

function secretFile() {

    createWindow(
        "DO_NOT_OPEN.TXT",
        `
        <pre>
WHY DID YOU OPEN THIS

Seriously.

There was literally a warning.

        </pre>
        `
    );
}


/* ---------- NOTEPAD ---------- */

function openNotepad() {

    createWindow(
        "Notepad",
        `
        <textarea
            placeholder="Type something unnecessary..."
        ></textarea>
        `,
        450,
        320
    );
}


/* ---------- CALCULATOR ---------- */

function openCalculator() {

    createWindow(
        "Calculator",
        `
        <input id="calcInput"
               style="width:100%"
               placeholder="2 + 2">

        <br><br>

        <button onclick="calculate()">Calculate</button>

        <p id="calcResult">Result: ???</p>
        `,
        300,
        200
    );
}


function calculate() {

    const input =
        document.getElementById("calcInput").value;

    try {

        /*
         * Yes, eval is normally a terrible idea.
         * This calculator is intentionally cursed.
         */

        const result = eval(input);

        document.getElementById("calcResult")
            .textContent =
            "Result: " + result;

    } catch {

        document.getElementById("calcResult")
            .textContent =
            "Result: calculator.exe has given up.";
    }
}


/* ---------- ABOUT ---------- */

function openAbout() {

    createWindow(
        "About window.exe",
        `
        <h2>window.exe</h2>

        <p>
        A completely unnecessary operating system
        running inside your browser.
        </p>

        <hr>

        <p>Version: probably</p>
        <p>RAM: yes</p>
        <p>CPU: somewhere</p>
        <p>Operating system: JavaScript</p>

        <button onclick="crash()">Crash</button>
        `
    );
}


/* ---------- START MENU ---------- */

function startMenu() {

    createWindow(
        "Start",
        `
        <h2>Start</h2>

        <button onclick="openExplorer()">
            📁 File Explorer
        </button>

        <br><br>

        <button onclick="openNotepad()">
            📄 Notepad
        </button>

        <br><br>

        <button onclick="openCalculator()">
            🧮 Calculator
        </button>

        <br><br>

        <button onclick="crash()">
            💀 Shut Down
        </button>
        `,
        280,
        300
    );
}


/* ---------- CRASH ---------- */

function crash() {

    document.body.innerHTML = `
        <div style="
            background:#000080;
            color:white;
            width:100vw;
            height:100vh;
            padding:10%;
            font-family:monospace;
        ">

        <h1>:(</h1>

        <h2>window.exe has crashed.</h2>

        <p>
        Your computer encountered a completely
        unnecessary problem.
        </p>

        <p>
        ERROR CODE: 0x00001313
        </p>

        <p>
        Press the button below to restart.
        </p>

        <button onclick="location.reload()">
            RESTART
        </button>

        </div>
    `;
}


/* ---------- TASKBAR ---------- */

function updateTasks() {

    const tasks =
        document.getElementById("tasks");

    tasks.innerHTML = "";

    document
        .querySelectorAll(".window")
        .forEach((win, index) => {

            const task =
                document.createElement("button");

            task.className = "task";

            task.textContent =
                win.querySelector(".titlebar span")
                   .textContent;

            task.onclick = () => {

                win.style.zIndex = ++zIndex;
            };

            tasks.appendChild(task);
        });
}


/* ---------- CLOCK ---------- */

function updateClock() {

    const now = new Date();

    document.getElementById("clock")
        .textContent =
        now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });
}

setInterval(updateClock, 1000);

updateClock();

</script>

</body>
</html>
