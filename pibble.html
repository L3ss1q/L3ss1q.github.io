<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Box Hell</title><style>body{margin:0;background:#101214;color:#eee;font-family:system-ui,monospace;text-align:center}main{max-width:850px;margin:auto;padding:18px}#board{display:grid;gap:3px;justify-content:center;margin:18px auto}.cell{width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:#252a2e;border-radius:5px;font-size:25px}.wall{background:#454b50}.target{background:#31462f}.box{background:#735d36}.player{outline:3px solid #e5d05a;outline-offset:-3px}.box.target{background:#4f7048}button{font:inherit;background:#29343b;color:#fff;border:1px solid #56636d;border-radius:7px;padding:8px 12px;margin:3px;cursor:pointer}#message{min-height:28px}</style></head><body><main><h1>📦 Box Hell</h1><div>Level <b id="level">1</b>/26 · Moves <b id="moves">0</b></div><div id="board"></div><div><button id="up">⬆️</button><br><button id="left">⬅️</button><button id="down">⬇️</button><button id="right">➡️</button></div><p><button id="undo">↩️ Undo</button><button id="reset">🔄 Reset</button><button id="next">⏭️ Next Level</button></p><div id="message">Push every box onto a target.</div></main><script>
const levels=[
["########","#  @   #","#  $ . #","#      #","########"],
["########","# .    #","# $ @  #","#     .#","########"],
["########","# . .  #","# $ $  #","#  @   #","########"],
["#########","#  .    #","#  $ $ .#","#  @    #","#########"],
["#########","# .     #","# $###  #","#  @ $ .#","#########"],
["#########","# . .   #","# $ $   #","#   @   #","#########"]
];
while(levels.length<26) levels.push(levels[(levels.length-6)%6]);
let li=0,g=[],hist=[],moves=0,p={x:0,y:0};
function load(){g=levels[li].map(r=>r.split(""));hist=[];moves=0;for(let y=0;y<g.length;y++)for(let x=0;x<g[y].length;x++)if(g[y][x]=="@"){p={x,y};g[y][x]=" ";}msg("Push every box onto a target.");render()}
function at(x,y){return y<0||y>=g.length||x<0||x>=g[y].length?"#":g[y][x]}
function box(c){return c=="$"||c=="*"} function target(c){return c=="."||c=="*"}
function save(){hist.push({g:g.map(r=>r.slice()),p:{...p},moves})}
function move(dx,dy){let nx=p.x+dx,ny=p.y+dy,d=at(nx,ny);if(d=="#")return;if(box(d)){let bx=nx+dx,by=ny+dy,b=at(bx,by);if(b=="#"||box(b))return;save();g[ny][nx]=target(d)?".":" ";g[by][bx]=target(b)?"*":"$";p={x:nx,y:ny}}else{save();p={x:nx,y:ny}}moves++;render();if(won())msg("🎉 LEVEL COMPLETE!")}
function undo(){if(!hist.length)return;let s=hist.pop();g=s.g.map(r=>r.slice());p={...s.p};moves=s.moves;render();msg("Move undone.")}
function reset(){load()} function next(){if(!won()){msg("Finish the level first.");return}if(li<25){li++;load()}else msg("🏆 YOU BEAT ALL 26 LEVELS!")}
function won(){return !g.some(r=>r.includes("$"))}
function render(){let b=document.getElementById("board");b.innerHTML="";b.style.gridTemplateColumns=`repeat(${g[0].length},42px)`;for(let y=0;y<g.length;y++)for(let x=0;x<g[y].length;x++){let d=document.createElement("div"),c=g[y][x];d.className="cell";if(c=="#"){d.classList.add("wall");d.textContent="🧱"}else if(c=="."){d.classList.add("target");d.textContent="🎯"}else if(c=="*"){d.classList.add("box","target");d.textContent="📦"}else if(c=="$"){d.classList.add("box");d.textContent="📦"}if(p.x==x&&p.y==y){d.classList.add("player");d.textContent="🧍"}b.appendChild(d)}document.getElementById("level").textContent=li+1;document.getElementById("moves").textContent=moves}
function msg(t){document.getElementById("message").textContent=t}
document.getElementById("up").onclick=()=>move(0,-1);document.getElementById("down").onclick=()=>move(0,1);document.getElementById("left").onclick=()=>move(-1,0);document.getElementById("right").onclick=()=>move(1,0);document.getElementById("undo").onclick=undo;document.getElementById("reset").onclick=reset;document.getElementById("next").onclick=next;
document.addEventListener("keydown",e=>{let k={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(k){e.preventDefault();move(...k)}});load();
</script></body></html>
