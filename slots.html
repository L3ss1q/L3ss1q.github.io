<!DOCTYPE html>
<html>
<head>
    <title>Suspicious Slot Machine - L3ss1q</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="card">

    <h1>🎰 Suspicious Slot Machine</h1>

    <p id="slots">[ ? ] [ ? ] [ ? ]</p>

    <button onclick="spin()">SPIN</button>

    <p id="result">Good luck.</p>

</div>

<script>
    const symbols = [
        "🍒",
        "🍋",
        "🔔",
        "7",
        "💾",
        "💰",
        "💎",
        "🧰",
        "💀"
    ];

    function spin() {
        const a = symbols[Math.floor(Math.random() * symbols.length)];
        const b = symbols[Math.floor(Math.random() * symbols.length)];
        const c = symbols[Math.floor(Math.random() * symbols.length)];

        document.getElementById("slots").textContent =
            "[ " + a + " ] [ " + b + " ] [ " + c + " ]";

        const result = document.getElementById("result");

        if (a === "💀" && b === "💀" && c === "💀") {
            result.textContent =
                "THE SLOT MACHINE HAS WON.";
        } else if (a === "🍒" && b === "🍒" && c === "🍒") {
            result.textContent =
                "TRANSGENDERISM.";
        } else if (a === "🍋" && b === "🍋" && c === "🍋") {
            result.textContent =
                "SOUR ATTACK.";
        } else if (a === "🔔" && b === "🔔" && c === "🔔") {
            result.textContent =
                "YOU LOSE YOUR EARDRUMS.";
        } else if (a === "7" && b === "7" && c === "7") {
            result.textContent =
                "JACKPOT!";
        } else if (a === "💾" && b === "💾" && c === "💾") {
            result.textContent =
                "MS-DOS HAS ENTERED THE CHAT.";
        } else if (a === "💰" && b === "💰" && c === "💰") {
            result.textContent =
                "SUPER JACKPOT!";
        } else if (a === "💎" && b === "💎" && c === "💎") {
            result.textContent =
                "MEGA JACKPOT!";
        } else if (a === "🧰" && b === "🧰" && c === "🧰") {
            result.textContent =
                "ULTRA JACKPOT!";
        } else {
            result.textContent =
                "You lose"; 
        }
    }
</script>

</body>
</html>
