<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz of Pain</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #111;
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #game {
        width: min(900px, 95vw);
        background: #1c1c1c;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 0 30px #000;
    }

    h1 {
        text-align: center;
        margin-top: 0;
    }

    #stats {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
        font-weight: bold;
    }

    #timer {
        height: 12px;
        background: #333;
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 20px;
    }

    #timerBar {
        height: 100%;
        width: 100%;
        background: #eee;
        transition: width 0.1s linear;
    }

    #question {
        font-size: clamp(20px, 4vw, 34px);
        text-align: center;
        margin: 30px 0;
        min-height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .answers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    button {
        border: none;
        border-radius: 12px;
        padding: 18px;
        font-size: 18px;
        cursor: pointer;
        background: #333;
        color: white;
        transition: 0.15s;
    }

    button:hover {
        transform: scale(1.02);
        background: #444;
    }

    button:active {
        transform: scale(0.98);
    }

    #message {
        text-align: center;
        min-height: 30px;
        margin-top: 20px;
        font-weight: bold;
    }

    #event {
        text-align: center;
        min-height: 25px;
        margin-bottom: 10px;
        font-size: 18px;
    }

    #startScreen,
    #endScreen {
        text-align: center;
    }

    #endScreen {
        display: none;
    }

    .big {
        font-size: 28px;
    }

    @media (max-width: 600px) {
        .answers {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<div id="game">

    <div id="startScreen">
        <h1>😈 QUIZ OF PAIN</h1>

        <p>
            It's a quiz game.<br>
            Except whoever designed it hates you.
        </p>

        <p>
            Correct answers give coins.<br>
            Wrong answers cause emotional damage.
        </p>

        <button onclick="startGame()">BEGIN THE SUFFERING</button>
    </div>

    <div id="quiz" style="display:none">

        <div id="stats">
            <span>💰 Coins: <span id="coins">0</span></span>
            <span>🔥 Streak: <span id="streak">0</span></span>
            <span>💀 Strikes: <span id="strikes">0</span>/3</span>
        </div>

        <div id="timer">
            <div id="timerBar"></div>
        </div>

        <div id="event"></div>

        <div id="question"></div>

        <div class="answers">
            <button onclick="answer(0)" id="a0"></button>
            <button onclick="answer(1)" id="a1"></button>
            <button onclick="answer(2)" id="a2"></button>
            <button onclick="answer(3)" id="a3"></button>
        </div>

        <div id="message"></div>

    </div>

    <div id="endScreen">
        <h1>💀 YOU SURVIVED</h1>

        <p class="big">
            Final score:
            <strong id="finalScore"></strong>
        </p>

        <p id="finalMessage"></p>

        <button onclick="location.reload()">SUFFER AGAIN</button>
    </div>

</div>

<script>

/* =========================
   QUESTION BANK
========================= */

const questions = [

    {
        q: "What is 7 × 8?",
        answers: ["54", "56", "64", "58"],
        correct: 1
    },

    {
        q: "What is √144?",
        answers: ["10", "11", "12", "14"],
        correct: 2
    },

    {
        q: "What is 2⁵?",
        answers: ["10", "16", "25", "32"],
        correct: 3
    },

    {
        q: "What is 15²?",
        answers: ["125", "225", "250", "215"],
        correct: 1
    },

    {
        q: "What is 100 ÷ 4?",
        answers: ["20", "25", "40", "50"],
        correct: 1
    },

    {
        q: `
        \\[
        \\left(
        \\frac{\\left(\\sum_{n=0}^{10}n\\right)+1}
        {\\left(\\prod_{n=1}^{3}n\\right)+2}
        +2-
        \\frac{2^{(2^2)}}{2}
        +1
        \\right)^x=1
        \\]
        <br>
        Solve for x.
        `,
        answers: ["-1", "0", "1", "2"],
        correct: 1
    },

    {
        q: "If x² = 49 and x > 0, what is x?",
        answers: ["-7", "0", "7", "49"],
        correct: 2
    },

    {
        q: "What is 3!?",
        answers: ["3", "6", "9", "12"],
        correct: 1
    },

    {
        q: "What is 2 + 2 × 3?",
        answers: ["12", "10", "8", "6"],
        correct: 2
    },

    {
        q: "What is 1,000,000 × 0?",
        answers: ["0", "1", "1,000,000", "undefined"],
        correct: 0
    }

];


/* =========================
   GAME STATE
========================= */

let coins = 0;
let streak = 0;
let strikes = 0;

let currentQuestion = 0;
let timeLeft = 15;
let timer;

let questionsPlayed = 0;


/* =========================
   START
========================= */

function startGame() {

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    shuffle(questions);

    showQuestion();

}


/* =========================
   QUESTION
========================= */

function showQuestion() {

    if (questionsPlayed >= questions.length) {
        endGame();
        return;
    }

    const q = questions[currentQuestion];

    document.getElementById("question").innerHTML = q.q;

    for (let i = 0; i < 4; i++) {
        document.getElementById("a" + i).textContent = q.answers[i];
        document.getElementById("a" + i).disabled = false;
    }

    document.getElementById("message").textContent = "";

    randomMeanEvent();

    timeLeft = 15;

    clearInterval(timer);

    timer = setInterval(() => {

        timeLeft -= 0.1;

        document.getElementById("timerBar").style.width =
            Math.max(0, timeLeft / 15 * 100) + "%";

        if (timeLeft <= 0) {

            clearInterval(timer);

            loseQuestion("TIME'S UP.");

        }

    }, 100);

    /*
       If MathJax exists, typeset the equation.
       The game still works without it.
    */

    if (window.MathJax) {
        MathJax.typeset();
    }
}


/* =========================
   ANSWER
========================= */

function answer(choice) {

    clearInterval(timer);

    const q = questions[currentQuestion];

    for (let i = 0; i < 4; i++) {
        document.getElementById("a" + i).disabled = true;
    }

    if (choice === q.correct) {

        streak++;

        let reward = 100 + streak * 25;

        coins += reward;

        document.getElementById("message").textContent =
            "✅ CORRECT. You have temporarily escaped.";

        updateStats();

        setTimeout(nextQuestion, 900);

    } else {

        loseQuestion("❌ WRONG. Incredible.");

    }

}


/* =========================
   WRONG ANSWER
========================= */

function loseQuestion(reason) {

    strikes++;

    streak = 0;

    coins = Math.max(0, Math.floor(coins * 0.9));

    document.getElementById("message").textContent =
        reason + " You lost 10% of your coins.";

    updateStats();

    if (strikes >= 3) {

        setTimeout(endGame, 1000);

    } else {

        setTimeout(nextQuestion, 1000);

    }

}


/* =========================
   NEXT
========================= */

function nextQuestion() {

    questionsPlayed++;

    currentQuestion++;

    if (currentQuestion >= questions.length) {
        currentQuestion = 0;
    }

    showQuestion();

}


/* =========================
   MEAN EVENTS
========================= */

function randomMeanEvent() {

    const event = document.getElementById("event");

    event.textContent = "";

    const roll = Math.random();

    if (roll < 0.08) {

        coins = Math.max(0, Math.floor(coins * 0.9));

        event.textContent =
            "💸 TAXATION: The government took 10% of your coins.";

    }

    else if (roll < 0.16) {

        timeLeft = 10;

        event.textContent =
            "⏰ SKILL ISSUE: You only get 10 seconds.";

    }

    else if (roll < 0.22) {

        event.textContent =
            "😈 NUH UH: This question looks suspicious.";

    }

    else if (roll < 0.27) {

        event.textContent =
            "📉 INFLATION: Everything is worth less now.";

    }

    else if (roll < 0.30) {

        strikes++;

        event.textContent =
            "💀 PRE-EMPTIVE STRIKE: That's unfortunate.";

        updateStats();

    }

}


/* =========================
   STATS
========================= */

function updateStats() {

    document.getElementById("coins").textContent = coins;
    document.getElementById("streak").textContent = streak;
    document.getElementById("strikes").textContent = strikes;

}


/* =========================
   END
========================= */

function endGame() {

    clearInterval(timer);

    document.getElementById("quiz").style.display = "none";
    document.getElementById("endScreen").style.display = "block";

    document.getElementById("finalScore").textContent = coins;

    let message;

    if (coins >= 1000)
        message = "You are mathematically dangerous.";

    else if (coins >= 500)
        message = "Not bad. The quiz only mildly destroyed you.";

    else if (coins > 0)
        message = "Technically you survived.";

    else
        message = "You have achieved financial nothingness.";

    document.getElementById("finalMessage").textContent = message;

}


/* =========================
   SHUFFLE
========================= */

function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
            [array[j], array[i]];

    }

}


/* =========================
   MATHJAX
========================= */

</script>

<script>
/*
   MathJax makes the cursed equations actually
   render as proper mathematics.
*/

window.MathJax = {

    tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']]
    },

    svg: {
        fontCache: 'global'
    }

};
</script>

<script async
src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>

</body>
</html>
