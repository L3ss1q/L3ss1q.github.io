<!DOCTYPE html>
<html>
<head>
    <title>L3ss1q</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Welcome</h1>

        <p>I am L3ss1q, a young C programmer striving to make an OS.</p>

        <h2>About me</h2>

        <p>
            Hi! I'm me. :3<br>
            I have been programming for 4 years<br>
            I am the creator of
            <a href="https://github.com/L3ss1q/KEDO-DOS">KEDO DOS</a>
            (experimental)
        </p>
        <br>
    <hr>
        <br>
        <section class="card">
    <h2>Developer Stuff :3</h2>

    <label for="alias">Online alias/Github username</label>
    <input type="text" id="alias" placeholder="e.g. L3ss1q">

    <label for="years">How many years have you been coding?</label>
    <input type="number" id="years" min="0" max="100">

    <label for="started">When did you start programming?</label>
    <input type="month" id="started">

    <label for="language">What's your favorite programming language?</label>
    <input type="text" id="language" placeholder="C? C++? Brainfuck?">

    <br>

    <button type="button">Submit :3</button>
</section>
    </div>
    <script>
    const button = document.querySelector("button");

    button.addEventListener("click", function () {
        const data = {
            username: document.getElementById("username").value,
            years: document.getElementById("years").value,
            started: document.getElementById("started").value,
            language: document.getElementById("language").value
        };

        const json = JSON.stringify(data, null, 4);

        const blob = new Blob([json], {
            type: "application/json"
        });

        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "developer-info.json";

        link.click();
    });
</script>
</body>
</html>
